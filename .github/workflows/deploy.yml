name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  workflow-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true
          activate-environment: workflow-check

      - name: Install Snakemake
        shell: bash -el {0}
        run: conda install -y snakemake-minimal pyyaml

      - name: Validate Snakemake DAG
        shell: bash -el {0}
        env:
          GWAS_GBD_LOCAL_CONFIG: workflow/fixtures/config.ci.yaml
        run: snakemake --snakefile workflow/Snakefile --cores 1 --dry-run

  build:
    runs-on: ubuntu-latest
    needs: workflow-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install frontend dependencies
        working-directory: site
        run: npm ci

      - name: Build frontend
        working-directory: site
        run: npm run build
        env:
          VITE_BASE: /GWAS-GBD/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R packages
        run: Rscript -e "install.packages(c('testthat', 'here'), repos='https://cloud.r-project.org')"

      - name: Run R unit tests
        run: Rscript site/tests/testthat.R

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install frontend dependencies
        working-directory: site
        run: npm ci

      - name: Install Playwright browsers
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Rebuild for e2e (need dist/)
        working-directory: site
        run: npm run build
        env:
          VITE_BASE: /GWAS-GBD/

      - name: Run smoke tests
        working-directory: site
        run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
